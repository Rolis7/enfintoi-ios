# Compilation iOS d'EnfinToi sur Codemagic (Mac dans le cloud) puis envoi vers App Store Connect / TestFlight.
# Prérequis dans Codemagic : Teams > Integrations > "Developer Portal" = clé API App Store Connect nommée YOPMACITE_ASC
workflows:
  ios-appstore:
    name: EnfinToi – iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: YOPMACITE_ASC
    environment:
      ios_signing:
        provisioning_profiles:
          - enfintoi_appstore
        certificates:
          - yopmacite_distribution
      vars:
        APP_STORE_APPLE_ID: 6820834826
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Installer les dépendances
        script: npm install
      - name: Générer le projet iOS
        script: |
          rm -rf ios
          npx cap add ios
      - name: Icônes et écran de démarrage (logo officiel)
        script: |
          curl -fsSL https://enfintoi.com/icons/icon-512.png -o /tmp/enfintoi-logo.png
          python3 -m pip install --quiet pillow || pip3 install --quiet pillow
          python3 scripts/logo.py /tmp/enfintoi-logo.png
          npm run ios:assets
      - name: Configurer le projet (push, photos, position, Info.plist)
        script: bash scripts/configure-ios.sh
      - name: Synchroniser Capacitor
        script: npx cap sync ios
      - name: Signature automatique
        script: xcode-project use-profiles
      - name: Numéro de build
        script: |
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          [ "$TF" -gt "$LATEST" ] 2>/dev/null && LATEST=$TF
          cd ios/App && agvtool new-version -all $(($LATEST + 1)) && agvtool new-marketing-version 1.0
      - name: Compiler le fichier .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" || {
              echo "===== ERREURS XCODE ====="
              grep -hE "error:|: error|requires a provisioning|doesn't include|entitlement" /tmp/xcodebuild_logs/*.log | sort -u | head -80
              exit 1
            }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - ykroland2002@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
