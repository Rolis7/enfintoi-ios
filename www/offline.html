<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EnfinToi – Hors connexion</title>
<style>
  html,body{margin:0;height:100%;background:#FBF7FA;color:#24163F;font-family:-apple-system,system-ui,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;box-sizing:border-box;gap:12px}
  .logo{width:84px;height:84px;border-radius:22px;background:linear-gradient(#FF4D8D,#DE1268);color:#fff;font-size:46px;line-height:84px}
  h1{font-size:22px;margin:8px 0 0}h1 span{color:#F72A7B}
  p{max-width:320px;color:#5b5070;line-height:1.5}
  button{background:#F72A7B;color:#fff;border:0;border-radius:999px;padding:14px 30px;font-size:16px;font-weight:700}
</style>
</head>
<body>
<main>
  <div class="logo">♥</div>
  <h1>Enfin<span>Toi</span></h1>
  <p>Pas de connexion internet. Vérifiez votre Wi‑Fi ou vos données mobiles, puis réessayez.</p>
  <button onclick="location.replace('https://enfintoi.com/ios/')">Réessayer</button>
</main>
<script>window.addEventListener('online',function(){location.replace('https://enfintoi.com/ios/');});</script>
</body>
</html>
